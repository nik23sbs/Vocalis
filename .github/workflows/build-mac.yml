name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner macOS"
        default: "macos-15"
      jobs:
        description: "Job da eseguire (all, oppure linux, mac, windows separati da virgola)"
        default: "all"

jobs:
  # ------------------------------------------------------------------ Linux: test del motore neurale reale
  linux-neural:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pacchetti di sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libgl-dev libxext-dev

      - name: Dipendenze + ONNX Runtime + modello
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/setup_deps.sh
          ./scripts/fetch_neural.sh neural

      - name: Compila (con motore neurale)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOCALIS_ORT_DIR="$PWD/neural/ort"
          cmake --build build --target VocalisCLI VocalisUnitTest VocalisHostTest Vocalis_VST3

      - name: Test voce neurale
        env:
          VOCALIS_MODELS: ${{ github.workspace }}/neural/models
          VOCALIS_ESPEAK_DATA: ${{ github.workspace }}/build/third_party/espeak-ng
        run: |
          mkdir -p /tmp/out
          C=./build/VocalisCLI_artefacts/Release/VocalisCLI
          $C --phonemize "Ciao a tutti, questa è la voce del plugin Vocalis."
          ./build/VocalisUnitTest_artefacts/Release/VocalisUnitTest
          $C --kokoro-run "Ciao a tutti, questa è la nuova voce."
          $C "Ciao a tutti, questa è la voce del plugin Vocalis. Andiamo a tempo!" /tmp/out/sara.wav --voice if_sara --syllables | tee /tmp/out/sara.txt
          grep -q "Motore: Kokoro" /tmp/out/sara.txt
          $C "Ciao a tutti, sono Nicola." /tmp/out/nicola.wav --voice im_nicola --mode free | tee /tmp/out/nicola.txt
          grep -q "Motore: Kokoro" /tmp/out/nicola.txt
          $C "Miscela di due voci." /tmp/out/blend.wav --voice if_sara --voiceB im_nicola --blend 0.5 --pitch 3 --formant -2 | grep -E "Motore|Render"
          # v3: vocali sulla griglia (< 1 ms), canto su note, armonie e doppio
          $C "Questa è la nuova voce di Vocalis, ogni sillaba cade a tempo." /tmp/out/rap_v3.wav --bpm 96 | tee /tmp/out/rap_v3.txt
          grep -q "Kokoro v3" /tmp/out/rap_v3.txt
          awk '/Errore griglia max/ { if ($(NF-1)+0 > 1.0) exit 1 }' /tmp/out/rap_v3.txt
          $C "La luna splende sul mare" /tmp/out/canto_v3.wav --bpm 90 --vmode canto --vibrato 30 \
             --notes "60:0:1,62:1:0.5,64:1.5:0.5,67:2:1,65:3:0.5,64:3.5:0.5,62:4:1,60:5:2" | tee /tmp/out/canto_v3.txt
          grep -q "Note: 60 62 64 67 65 64 62 60" /tmp/out/canto_v3.txt
          $C "La luna splende sul mare" /tmp/out/coro_v3.wav --bpm 90 --vmode canto --harm1 2 --harm2 4 --double \
             --notes "60:0:1,62:1:0.5,64:1.5:0.5,67:2:1,65:3:0.5,64:3.5:0.5,62:4:1,60:5:2" | grep -E "Motore|Canali"
          ./build/VocalisHostTest_artefacts/Release/VocalisHostTest

      - uses: actions/upload-artifact@v4
        with:
          name: Vocalis-neural-samples
          path: /tmp/out/*.wav

  # ------------------------------------------------------------------ macOS: plugin universale + installer
  mac:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'mac') }}
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze + ONNX Runtime + modello
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/setup_deps.sh
          ./scripts/fetch_neural.sh neural
          lipo -info neural/ort/lib/libonnxruntime.*.dylib || true

      - name: Configura (universale arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVOCALIS_BUILD_TESTS=ON -DVOCALIS_ORT_DIR="$PWD/neural/ort"

      - name: Compila
        run: cmake --build build --target Vocalis_VST3 Vocalis_AU Vocalis_Standalone VocalisHostTest VocalisCLI VocalisUnitTest -j "$(sysctl -n hw.ncpu)"

      - name: Verifica architetture e contenuto dei bundle
        run: |
          lipo -info build/Vocalis_artefacts/Release/VST3/Vocalis.vst3/Contents/MacOS/Vocalis
          lipo -info build/Vocalis_artefacts/Release/AU/Vocalis.component/Contents/MacOS/Vocalis
          ls build/Vocalis_artefacts/Release/AU/Vocalis.component/Contents/Frameworks
          lipo -info build/Vocalis_artefacts/Release/AU/Vocalis.component/Contents/Frameworks/libonnxruntime*.dylib

      - name: Test (DAW simulata + voce neurale)
        env:
          VOCALIS_MODELS: ${{ github.workspace }}/neural/models
          VOCALIS_ESPEAK_DATA: ${{ github.workspace }}/build/third_party/espeak-ng
        run: |
          mkdir -p /tmp/out
          ./build/VocalisUnitTest_artefacts/Release/VocalisUnitTest
          ./build/VocalisCLI_artefacts/Release/VocalisCLI --kokoro-run "Prova della voce a tempo."
          ./build/VocalisCLI_artefacts/Release/VocalisCLI "Prova della voce neurale su Mac." /tmp/out/mac.wav | tee /tmp/out/mac.txt
          grep -q "Motore: Kokoro" /tmp/out/mac.txt
          ./build/VocalisHostTest_artefacts/Release/VocalisHostTest

      - name: Firma ad-hoc
        run: |
          for b in VST3/Vocalis.vst3 AU/Vocalis.component Standalone/Vocalis.app; do
            codesign --force --deep -s - "build/Vocalis_artefacts/Release/$b"
          done

      - name: Validazione Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Vocalis_artefacts/Release/AU/Vocalis.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -strict -v aumu Vcl1 Vcls

      - name: Validazione VST3 (pluginval)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate build/Vocalis_artefacts/Release/VST3/Vocalis.vst3

      - name: Salva i plugin compilati
        uses: actions/upload-artifact@v4
        with:
          name: Vocalis-plugins
          path: |
            build/Vocalis_artefacts/Release/VST3/Vocalis.vst3
            build/Vocalis_artefacts/Release/AU/Vocalis.component
            build/Vocalis_artefacts/Release/Standalone/Vocalis.app

      - name: Crea installer .pkg
        run: ./installer/make_pkg.sh build/Vocalis_artefacts/Release neural/models

      - name: Prova installazione del .pkg
        run: |
          sudo installer -pkg dist/*.pkg -target /
          ls -d /Library/Audio/Plug-Ins/VST3/Vocalis.vst3 /Library/Audio/Plug-Ins/Components/Vocalis.component /Applications/Vocalis.app
          ls -la "/Library/Application Support/Vocalis/models"
          # senza VOCALIS_MODELS: il modello deve essere trovato nella cartella installata
          VOCALIS_ESPEAK_DATA="$PWD/build/third_party/espeak-ng" ./build/VocalisCLI_artefacts/Release/VocalisCLI \
            "Installazione completata." /tmp/out/inst.wav | tee /tmp/out/inst.txt
          grep -q "Motore: Kokoro" /tmp/out/inst.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vocalis-macOS
          path: dist/*.pkg

  # ------------------------------------------------------------------ Windows: VST3 + app + installer
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze + ONNX Runtime + modello
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/setup_deps.sh
          ./scripts/fetch_neural.sh neural
          ls -la neural/ort/lib neural/models

      - name: Configura (Visual Studio installato, x64)
        run: cmake -S . -B build -A x64 -DVOCALIS_BUILD_TESTS=ON -DVOCALIS_ORT_DIR="$(cygpath -m "$PWD/neural/ort")"

      - name: Compila
        run: cmake --build build --config Release --parallel --target Vocalis_VST3 Vocalis_Standalone VocalisCLI VocalisUnitTest VocalisHostTest

      - name: Contenuto del plugin
        run: |
          find build/Vocalis_artefacts/Release/VST3/Vocalis.vst3 -maxdepth 3 | head -20
          ls build/Vocalis_artefacts/Release/Standalone

      - name: Test (DAW simulata + voce neurale)
        run: |
          export VOCALIS_MODELS="$(cygpath -m "$PWD/neural/models")"
          export VOCALIS_ESPEAK_DATA="$(cygpath -m "$PWD/build/third_party/espeak-ng")"
          mkdir -p out
          ./build/VocalisUnitTest_artefacts/Release/VocalisUnitTest.exe
          C=./build/VocalisCLI_artefacts/Release/VocalisCLI.exe
          $C --kokoro-run "Prova della voce a tempo su Windows."
          $C "Questa è la nuova voce di Vocalis, ogni sillaba cade a tempo." out/rap.wav --bpm 96 | tee out/rap.txt
          grep -q "Kokoro v3" out/rap.txt
          awk '/Errore griglia max/ { if ($(NF-1)+0 > 1.0) exit 1 }' out/rap.txt
          $C "La luna splende sul mare" out/canto.wav --bpm 90 --vmode canto --harm1 2 --double \
             --notes "60:0:1,62:1:0.5,64:1.5:0.5,67:2:1,65:3:0.5,64:3.5:0.5,62:4:1,60:5:2" | tee out/canto.txt
          grep -q "Note: 60 62 64 67 65 64 62 60" out/canto.txt
          ./build/VocalisHostTest_artefacts/Release/VocalisHostTest.exe

      - name: Validazione VST3 (pluginval)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate "$(cygpath -w "$PWD/build/Vocalis_artefacts/Release/VST3/Vocalis.vst3")"

      - name: Crea installer .exe (Inno Setup)
        run: |
          choco install innosetup -y --no-progress > /dev/null || true
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          VERSION=$(grep -Eo 'project\(Vocalis VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')
          "$ISCC" "/DVersion=$VERSION" "/DArt=$(cygpath -w "$PWD/build/Vocalis_artefacts/Release")" \
                  "/DModels=$(cygpath -w "$PWD/neural/models")" installer/windows/Vocalis.iss
          ls -la dist

      - name: Prova installazione
        run: |
          ./dist/Vocalis-*-Windows.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //SP-
          sleep 5
          ls "/c/Program Files/Common Files/VST3/Vocalis.vst3/Contents"
          ls "/c/Program Files/Vocalis/Vocalis.exe" "/c/ProgramData/Vocalis/models"
          # senza VOCALIS_MODELS: il modello deve essere trovato in C:\ProgramData\Vocalis\models
          VOCALIS_ESPEAK_DATA="$(cygpath -m "$PWD/build/third_party/espeak-ng")" ./build/VocalisCLI_artefacts/Release/VocalisCLI.exe \
            "Installazione completata." out/inst.wav | tee out/inst.txt
          grep -q "Motore: Kokoro" out/inst.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vocalis-Windows
          path: dist/*.exe

