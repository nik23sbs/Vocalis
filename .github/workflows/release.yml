name: Pubblica installer

# Crea (o aggiorna) una Release con gli installer prodotti da una build gia' riuscita.
on:
  workflow_dispatch:
    inputs:
      mac_run:
        description: "ID della build con Vocalis-macOS"
        required: true
      win_run:
        description: "ID della build con Vocalis-Windows"
        required: true
      tag:
        description: "Versione"
        default: "v0.3.0"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica gli installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.mac_run }}" -R "$GITHUB_REPOSITORY" -n Vocalis-macOS -D mac
          gh run download "${{ inputs.win_run }}" -R "$GITHUB_REPOSITORY" -n Vocalis-Windows -D win
          find mac win -type f -exec ls -la {} \;
      - name: Crea la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find mac win -type f \( -name "*.pkg" -o -name "*.exe" \))
          gh release delete "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ inputs.tag }}" $FILES -R "$GITHUB_REPOSITORY" --target "${{ github.sha }}" \
            --title "Vocalis 3 (${{ inputs.tag }})" \
            --notes "Installer di Vocalis 3. Mac: apri il file .pkg (se macOS lo blocca: tasto destro > Apri). Windows: apri il file .exe (se compare 'Windows ha protetto il PC': Ulteriori informazioni > Esegui comunque)."
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | .name + " " + (.size|tostring) + " " + .url'
